name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Exercise the real registry and certificate tools on the Windows runner.
      URLMON_WINDOWS_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v
      - name: Smoke test from source
        run: python packaging/smoke_test.py python -m urlmonitor

  package:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build URLMonitor.exe and the installer
        shell: pwsh
        run: packaging/build.ps1
      - name: Smoke test URLMonitor.exe
        run: python packaging/smoke_test.py dist/URLMonitor/URLMonitor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: URLMonitor-Setup
          path: dist/URLMonitor-Setup-*.exe
          if-no-files-found: error
