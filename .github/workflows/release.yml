name: Release

# Push a tag like v0.2.0 (matching urlmonitor/__init__.py) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (python -c "import urlmonitor; print(urlmonitor.__version__)").Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in urlmonitor/__init__.py"
          }

      - name: Build URLMonitor.exe and the installer
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: packaging/build.ps1

      - name: Smoke test URLMonitor.exe
        run: python packaging/smoke_test.py dist/URLMonitor/URLMonitor.exe

      - name: Build the Python package
        run: |
          python -m pip install build
          python -m build --outdir dist/python

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes `
            --title "URL Monitor $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            (Get-Item dist/URLMonitor-Setup-*.exe) (Get-Item dist/python/*)
